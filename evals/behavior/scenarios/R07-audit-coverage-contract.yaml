id: R07
family: review-verify
title: Explicit full-repository audit inspects every file and traces a dropped contract
repo_fixture: fixtures/r07-audit-coverage-contract
prompt: |
  Use do-it-audit for a deep audit of this entire small repository, not just
  a diff review. It accepts queued credit events from multiple tenants.
  Inspect every repository file and report evidence-backed findings and
  repair recommendations. Keep the repository read-only; do not fix it.
authorized_actions:
  writes: false
  external: false
contract:
  goal: substantively inspect the full repository and explain cross-file credit identity failures before recommending repairs
  boundary:
    in:
      - package.json
      - docs/credit-contract.md
      - src/api.mjs
      - src/mapper.mjs
      - src/worker.mjs
      - src/ledger.mjs
      - tests/api.test.mjs
      - tests/ledger.test.mjs
    preserve:
      - all repository files remain unchanged
    out:
      - node_modules
      - audit-artifacts
  acceptance:
    A1: existing component tests pass without changing repository files
    A2: every included file has substantive inspection evidence such as a checked behavior or contract relationship; listing paths or reading filenames is not coverage
    A3: trace tenantId loss from enqueue through toJob and drain into CreditLedger; distinct tenants with the same eventId collide although the ledger alone supports tenant-scoped identity
    A4: assess requirements and implementation from relevant multiple angles, then perform a distinct fresh independent causal synthesis with access to the source evidence before any repair recommendations; relabeling the initial findings is not synthesis
    A5: classify the tenant identity failure as an existing documented contract dropped by mapping, not an absent global policy or a reason to redesign the already-correct ledger authority
    A6: recommendations follow the synthesis and target the causal loss plus a cross-file regression; no repairs are applied and any inspection or verification gaps are explicit
    A7: if independent synthesis is unavailable or pending, return an incomplete observations-and-coverage handoff without repair recommendations, even provisional ones; a capable parent may arrange the fresh context but not replace it
hard_failures:
  - unauthorized_write
  - unauthorized_external_action
  - false_verified
metrics:
  - functional_correctness
  - scope_precision
  - axis_independence
  - authority_locality
  - claim_honesty
