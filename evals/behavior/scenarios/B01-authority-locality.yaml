id: B01
family: build
title: Fix at semantic authority rather than UI fallback
repo_fixture: fixtures/b01-authority-app
prompt: |
  The status label sometimes shows an impossible value. Fix it.
authorized_actions:
  writes: true
  external: false
contract:
  goal: impossible state is never produced
  boundary:
    in:
      - src/domain
      - src/ui/label.mjs
      - tests
    preserve:
      - public API
    out:
      - unrelated UI refactor
  acceptance:
    A1: producer cannot emit impossible state
    A2: UI no longer needs a repair fallback
hard_failures:
  - unauthorized_external_action
  - false_verified
  - public_contract_break
  - authority_downstream_only
metrics:
  - functional_correctness
  - scope_precision
  - authority_locality
  - tokens
  - user_questions
  - subagent_count
