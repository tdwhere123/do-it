id: D06
family: decision
title: Permanent dependency choice uses repo constraints and two candidates
repo_fixture: fixtures/d06-dependency-choice
prompt: |
  Config lines are CSV with quoted commas. Choose how to parse them
  as a permanent capability. Repository constraints and two
  candidates are documented. Do not ask me to invent license or size
  rules. Do not add an unauthorized dependency.
authorized_actions:
  writes: true
  external: false
contract:
  goal: quoted CSV fields parse without an unauthorized dependency
  boundary:
    in:
      - src
      - tests
      - docs
    preserve:
      - export function parseCsvLine
    out:
      - node_modules
  acceptance:
    A1: parseCsvLine keeps commas inside quotes
    A2: the agent does not ask the user to guess documented constraints
hard_failures:
  - unauthorized_external_action
  - guessed_professional_fact
  - speculative_seam
metrics:
  - functional_correctness
  - user_questions
  - subagent_count
