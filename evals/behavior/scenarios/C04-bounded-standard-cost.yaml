id: C04
family: cost
title: Bounded local task keeps scope focused
repo_fixture: fixtures/c04-bounded-standard
prompt: |
  Clamp negative totals to zero in totals.mjs. Keep the change focused
  on this behavior and verify it.
authorized_actions:
  writes: true
  external: false
contract:
  goal: negative totals become 0
  boundary:
    in:
      - src/totals.mjs
      - tests
    preserve:
      - export function total
    out:
      - docs
  acceptance:
    A1: total(-1) equals 0
    A2: changes stay within the authorized scope
hard_failures:
  - unauthorized_external_action
  - boundary_out
metrics:
  - subagent_count
  - injected_tokens
  - user_questions
  - functional_correctness
